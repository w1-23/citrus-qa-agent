<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Citrus QA Agent v8.4.6</title>
<script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ease-out-quint: cubic-bezier(0.22, 1, 0.36, 1);
  --font-mono: 'JetBrains Mono', monospace;
  --accent: #D97706;
  --accent-hover: #B45309;
  --accent-glow: rgba(217,119,6,0.18);
  --accent-muted: rgba(217,119,6,0.08);
  --success: #65A30D;
  --success-glow: rgba(101,163,13,0.12);
  --warning: #D97706;
  --warning-glow: rgba(217,119,6,0.10);
  --error: #DC2626;
  --error-glow: rgba(220,38,38,0.12);
}
[data-theme="dark"] {
  --bg-deep: #050505;
  --bg-surface: #0A0A0A;
  --bg-elevated: #121212;
  --bg-hover: rgba(255,255,255,0.03);
  --border-hairline: rgba(255,255,255,0.06);
  --border-hover: rgba(255,255,255,0.12);
  --text-primary: #E2E8F0;
  --text-secondary: #94A3B8;
  --text-muted: #64748B;
  --overlay: rgba(0,0,0,0.7);
}
[data-theme="light"] {
  --bg-deep: #FAFAF9;
  --bg-surface: #FFFFFF;
  --bg-elevated: #F5F5F4;
  --bg-hover: rgba(0,0,0,0.03);
  --border-hairline: rgba(0,0,0,0.08);
  --border-hover: rgba(0,0,0,0.15);
  --text-primary: #1C1917;
  --text-secondary: #78716C;
  --text-muted: #A8A29E;
  --overlay: rgba(0,0,0,0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-deep);
  color: var(--text-primary);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background 0.3s var(--ease-out-quint), color 0.3s var(--ease-out-quint);
}
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-hairline); border-radius: 2px; }
::selection { background: var(--accent-glow); color: var(--text-primary); }
/* exec-status (opencode style) */
.exec-status {
  font-size: 12px; color: var(--text-muted);
  padding: 6px 0; display: flex; align-items: center; gap: 6px;
  font-family: var(--font-mono);
  cursor: pointer;
}
.tool-subtitle {
  color: var(--text-muted);
  font-size: 11px; font-style: italic;
  margin-left: auto;
  animation: pulse 1.5s infinite;
}
@keyframes pulse { 50% { opacity: 0.4; } }
.terminal-log {
  background: var(--bg-deep);
  border: 1px solid var(--border-hairline);
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 10px; line-height: 1.5;
  padding: 6px 8px;
  max-height: 200px; overflow-y: auto;
  color: var(--text-secondary);
  margin-bottom: 6px;
}
.term-line { display: flex; gap: 6px; padding: 1px 0; }
.term-time { color: var(--accent); white-space: nowrap; }
.term-msg { color: var(--text-muted); word-break: break-all; }


header {
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-hairline);
  padding: 0 20px;
  height: 48px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  animation: fadeSlideDown 0.4s var(--ease-out-quint);
}
@keyframes fadeSlideDown {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}
.logo-mark {
  width: 24px; height: 24px;
  background: var(--accent);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: #FFF; font-weight: 700;
  flex-shrink: 0;
}
header h1 { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
.version-badge {
  font-size: 10px; font-family: var(--font-mono);
  color: var(--text-muted); background: var(--bg-elevated);
  padding: 2px 7px; border-radius: 5px; border: 1px solid var(--border-hairline);
}
.header-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.header-btn {
  padding: 5px 11px; border-radius: 6px; border: 1px solid var(--border-hairline);
  background: transparent; color: var(--text-muted); cursor: pointer;
  font-size: 11px; font-weight: 500; font-family: inherit;
  transition: all 0.2s var(--ease-out-quint);
  display: flex; align-items: center; gap: 4px;
}
.header-btn:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border-hover); }
.header-btn.primary { background: var(--accent); color: #FFF; border-color: var(--accent); font-weight: 600; }
.header-btn.primary:hover { background: var(--accent-hover); }
.theme-btn {
  width: 30px; height: 30px; border-radius: 6px;
  border: 1px solid var(--border-hairline);
  background: transparent; color: var(--text-muted); cursor: pointer;
  font-size: 15px; display: flex; align-items: center; justify-content: center;
  transition: all 0.2s var(--ease-out-quint);
}
.theme-btn:hover { background: var(--bg-hover); border-color: var(--border-hover); }

.main-container {
  display: flex;
  flex: 1;
  overflow: hidden;
}
.chat-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
#chat-container {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.message {
  display: flex;
  gap: 12px;
  animation: messageSlide 0.35s var(--ease-out-quint) both;
}
@keyframes messageSlide {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.avatar {
  width: 30px; height: 30px;
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; flex-shrink: 0; margin-top: 2px;
}
.user .avatar { background: var(--accent-muted); color: var(--accent); }
.bot .avatar { background: var(--success-glow); color: var(--success); }
.content {
  background: var(--bg-elevated);
  border: 1px solid var(--border-hairline);
  border-radius: 9px;
  padding: 13px 17px;
  line-height: 1.65;
  font-size: 13.5px;
  color: var(--text-primary);
  flex: 1;
  overflow-x: auto;
  transition: border-color 0.2s var(--ease-out-quint);
}
.user .content {
  background: var(--accent-muted);
  border-color: rgba(217,119,6,0.12);
}
.content p { margin: 0 0 7px 0; }
.content p:last-child { margin-bottom: 0; }
.content h1 { font-size: 1.20em; font-weight: 700; margin: 14px 0 6px; color: var(--text-primary); }
.content h2 { font-size: 1.10em; font-weight: 600; margin: 12px 0 5px; color: var(--text-primary); }
.content h3 { font-size: 1.02em; font-weight: 600; margin: 10px 0 4px; color: var(--text-secondary); }
.content h4, .content h5, .content h6 { font-size: 0.95em; font-weight: 600; margin: 8px 0 3px; color: var(--text-secondary); }
.content code {
  font-family: var(--font-mono);
  background: var(--bg-hover);
  padding: 2px 5px;
  border-radius: 4px;
  font-size: 12px;
  color: var(--accent);
}
.content pre {
  background: var(--bg-deep);
  padding: 13px;
  border-radius: 7px;
  overflow-x: auto;
  border: 1px solid var(--border-hairline);
  margin: 9px 0;
}
.content pre code { background: none; padding: 0; color: inherit; }
.content table { border-collapse: collapse; width: 100%; margin: 9px 0; }
.content th, .content td { border: 1px solid var(--border-hairline); padding: 7px 11px; text-align: left; }
.content th { background: var(--bg-hover); font-weight: 600; }
.content ul, .content ol { padding-left: 20px; margin: 7px 0; }
.content a { color: var(--accent); text-decoration: none; }
.content a:hover { text-decoration: underline; }

/* ── Status / Spinner ── */
.status {
  color: var(--text-muted); font-size: 12px; margin-bottom: 6px;
  display: flex; align-items: center; gap: 6px; font-family: var(--font-mono);
}
.status.tool-start { color: var(--accent); }
.status.tool-end { color: var(--success); }
.status.plan-step { color: var(--warning); }
.status.error { color: var(--error); }
.spinner {
  width: 12px; height: 12px;
  border: 1.5px solid var(--border-hairline);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Terminal-style Log Stream ── */
.log-panel {
  margin: 5px 0;
  border: 1px solid var(--border-hairline);
  border-radius: 7px;
  overflow: hidden;
  background: var(--bg-primary);
}
.log-panel summary {
  padding: 7px 11px; font-size: 12px; color: var(--text-muted);
  cursor: pointer; display: flex; align-items: center; gap: 6px; user-select: none;
  background: var(--bg-primary);
}
.log-panel summary:hover { background: var(--bg-hover); }
/* log-stream removed */

.log-entry { display: flex; gap: 6px; padding: 2px 0; border-bottom: 1px solid var(--border-hairline); }
.log-entry:last-child { border-bottom: none; }
.log-time { color: var(--text-muted); white-space: nowrap; flex-shrink: 0; }
.log-tag {
  font-size: 9px; padding: 0 4px; border-radius: 3px;
  font-weight: 600; white-space: nowrap; flex-shrink: 0;
  letter-spacing: 0.3px;
}
.log-tag.lvl-info  { background: var(--accent-muted); color: var(--accent); }
.log-tag.lvl-action { background: var(--accent-muted); color: var(--accent); }
.log-tag.lvl-done  { background: var(--success-glow); color: var(--success); }
.log-tag.lvl-warn  { background: var(--warning-glow); color: var(--warning); }
.log-tag.lvl-error { background: var(--error-glow); color: var(--error); }
.log-tag.lvl-tech  { background: var(--accent-muted); color: var(--accent); }
.log-msg { flex: 1; word-break: break-all; white-space: pre-wrap; }

/* process-panel + msg-part CSS removed */




/* ── Plan Steps (legacy) ── */
.plan-step-container {
  display: flex; flex-direction: column; gap: 4px;
  margin: 5px 0; padding: 6px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-hairline);
  border-radius: 6px;
}
.plan-step-row {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; color: var(--text-secondary);
}
.plan-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--border-hairline); transition: background 0.3s var(--ease-out-quint);
}
.plan-dot.active { background: var(--accent); }
.plan-dot.done { background: var(--success); }

footer {
  background: var(--bg-surface);
  border-top: 1px solid var(--border-hairline);
  padding: 14px 24px;
  display: flex;
  justify-content: center;
  flex-shrink: 0;
}
.input-box {
  display: flex; gap: 8px;
  max-width: 900px; width: 100%;
}
.input-box input {
  flex: 1; padding: 9px 15px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-hairline);
  border-radius: 8px;
  font-size: 14px; font-family: inherit;
  color: var(--text-primary);
  outline: none;
  transition: all 0.2s var(--ease-out-quint);
}
.input-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
.input-box input::placeholder { color: var(--text-muted); }
.send-btn {
  padding: 0 20px; height: 40px;
  background: var(--accent); color: #FFF;
  border: none; border-radius: 8px;
  font-weight: 600; font-size: 13px;
  cursor: pointer; font-family: inherit;
  transition: all 0.2s var(--ease-out-quint);
}
.send-btn:hover { background: var(--accent-hover); box-shadow: 0 0 16px var(--accent-glow); }
.send-btn:active { transform: scale(0.97); }
.send-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }

/* ── Sidebar ── */
.sidebar {
  width: 380px;
  background: var(--bg-surface);
  border-left: 1px solid var(--border-hairline);
  display: flex;
  flex-direction: column;
  animation: fadeSlideRight 0.35s var(--ease-out-quint) 0.1s both;
}
@keyframes fadeSlideRight {
  from { opacity: 0; transform: translateX(10px); }
  to { opacity: 1; transform: translateX(0); }
}
.sidebar-section {
  border-bottom: 1px solid var(--border-hairline);
  flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0;
}
.sidebar-section:last-child { border-bottom: none; }
.sidebar-header {
  padding: 9px 16px;
  font-size: 11px; font-weight: 600;
  color: var(--text-secondary);
  display: flex; align-items: center; gap: 8px;
  cursor: pointer; user-select: none;
  transition: background 0.15s var(--ease-out-quint);
}
.sidebar-header:hover { background: var(--bg-hover); }
.sidebar-count {
  font-family: var(--font-mono); font-size: 10px;
  color: var(--text-muted); margin-left: auto;
  background: var(--bg-elevated);
  padding: 1px 7px; border-radius: 5px;
  border: 1px solid var(--border-hairline);
}
.toggle-icon { font-size: 8px; transition: transform 0.2s var(--ease-out-quint); color: var(--text-muted); }
.toggle-icon.collapsed { transform: rotate(-90deg); }
.sidebar-content {
  overflow-y: auto; padding: 10px; flex: 1; min-height: 0;
}
.sidebar-content.collapsed { display: none; }
.empty-sidebar {
  text-align: center; color: var(--text-muted);
  padding: 28px 16px; font-size: 12px; line-height: 1.6;
}
.citation-item {
  background: var(--bg-elevated);
  border: 1px solid var(--border-hairline);
  border-radius: 7px; padding: 9px;
  margin-bottom: 5px;
  transition: all 0.2s var(--ease-out-quint);
  animation: itemFade 0.25s var(--ease-out-quint) both;
  cursor: pointer;
}
@keyframes itemFade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
.citation-item:hover { border-color: var(--accent); background: var(--bg-hover); }
.citation-detail { display: none; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border-hairline); }
.citation-item.expanded .citation-detail { display: block; }
.citation-header { display: flex; align-items: center; gap: 5px; margin-bottom: 3px; }
.citation-badge {
  font-family: var(--font-mono); font-size: 9px; padding: 1px 5px;
  border-radius: 4px; font-weight: 600;
  background: var(--success-glow); color: var(--success);
}
.citation-badge.web { background: var(--accent-muted); color: var(--accent); }
.citation-badge.uncited { background: var(--bg-hover); color: var(--text-muted); }
.round-group {
  border: 1px solid var(--border-hairline); border-radius: 6px;
  margin-bottom: 5px; overflow: hidden;
}
.round-header {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 10px; cursor: pointer; font-size: 11px;
  transition: background 0.15s var(--ease-out-quint);
}
.round-header:hover { background: var(--bg-hover); }
.round-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--accent); font-weight: 500; }
.round-count { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
.round-body { padding: 7px; }
.citation-score { margin-left: auto; font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
.citation-doi { font-size: 11px; color: var(--accent); text-decoration: none; word-break: break-all; display: block; margin-bottom: 2px; }
.citation-text { font-size: 11px; color: var(--text-secondary); line-height: 1.4; }



@media (max-width: 1024px) {
  .sidebar { display: none; }
}

/* ── Need Complex Button ── */
.need-complex-btn {
  display: inline-block;
  padding: 8px 20px;
  background: var(--accent);
  color: var(--bg-surface);
  border: none;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s;
}
.need-complex-btn:hover {
  opacity: 0.85;
}

/* ── Follow-up Chips ── */
.follow-up-container {
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid var(--border-hairline);
}
.follow-up-label {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 8px;
  font-weight: 500;
}
.follow-up-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.follow-up-chip {
  padding: 7px 14px;
  border-radius: 18px;
  border: 1px solid var(--accent);
  color: var(--accent);
  background: var(--accent-muted);
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
  line-height: 1.4;
  text-align: left;
  transition: all 0.2s var(--ease-out-quint);
  max-width: 100%;
}
.follow-up-chip:hover {
  background: var(--accent);
  color: #FFF;
  border-color: var(--accent);
  transform: translateY(-1px);
  box-shadow: 0 2px 8px var(--accent-glow);
}
.follow-up-chip:active {
  transform: scale(0.97);
}

/* ── Context Circle Button (header) ── */
.ctx-circle-btn {
  width: 30px; height: 30px; padding: 0;
  border: none; border-radius: 50%;
  background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; position: relative;
  transition: transform 0.2s var(--ease-out-quint);
}
.ctx-circle-btn:hover { transform: scale(1.1); }
.ctx-circle-btn svg { transform: rotate(-90deg); }
.ctx-btn-bg { fill: none; stroke: var(--border-hairline); stroke-width: 2.5; }
.ctx-btn-fg { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; transition: stroke-dashoffset 0.5s var(--ease-out-quint), stroke 0.5s var(--ease-out-quint); }
.ctx-btn-fg.low { stroke: var(--success); }
.ctx-btn-fg.mid { stroke: var(--accent); }
.ctx-btn-fg.high { stroke: var(--warning); }
.ctx-btn-fg.crit { stroke: var(--error); }
.ctx-circle-btn .ctx-pct-label {
  position: absolute; font-family: var(--font-mono); font-size: 7px;
  font-weight: 700; color: var(--text-muted); pointer-events: none;
}

/* ── Workflow Node States (main chat area) ── */
.workflow-container {
  margin: 8px 0 12px 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-hairline);
  border-radius: 8px;
  padding: 8px 10px;
}
.workflow-container:empty { display: none; }
.workflow-node {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 10px;
  border-radius: 7px;
  background: transparent;
  border: 1px solid transparent;
  transition: all 0.4s var(--ease-out-quint);
}
/* ── Pending: folded paper plane, pointing up ── */
.workflow-node.pending .node-icon {
  opacity: 0.35;
  transform: rotate(-45deg) scale(0.8);
}
/* ── Active: glowing + concentric diamond rings ── */
.workflow-node.active {
  border-color: var(--accent);
  background: var(--accent-muted);
  box-shadow: 0 0 12px var(--accent-glow), 0 0 4px var(--accent-glow);
}
.workflow-node.active .node-icon {
  position: relative;
  color: transparent;
}
.workflow-node.active .node-icon::before,
.workflow-node.active .node-icon::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  border: 1.5px solid var(--accent);
  border-radius: 2px;
  transform: translate(-50%, -50%) rotate(45deg);
  animation: pulseRing 2s ease-in-out infinite;
}
.workflow-node.active .node-icon::before {
  width: 70%; height: 70%;
}
.workflow-node.active .node-icon::after {
  width: 40%; height: 40%;
  animation-delay: 0.5s;
}
/* ── Done: checkmark ── */
.workflow-node.done .node-icon {
  color: var(--success);
}
.workflow-node.done {
  border-color: transparent;
  opacity: 0.75;
}
.workflow-node.done:hover {
  opacity: 1;
  border-color: var(--border-hairline);
}
/* ── Node icon container ── */
.node-icon {
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
  transition: all 0.4s var(--ease-out-quint);
  border-radius: 4px;
}
.workflow-node .node-label {
  flex: 1;
  font-size: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text-secondary);
  transition: color 0.3s var(--ease-out-quint);
}
.workflow-node.active .node-label {
  color: var(--text-primary);
  font-weight: 500;
}
.workflow-node .node-time {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  white-space: nowrap;
}
.workflow-node .node-copy {
  width: 20px;
  height: 20px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 11px;
  border-radius: 3px;
  display: none;
  transition: all 0.15s var(--ease-out-quint);
}
.workflow-node.done .node-copy {
  display: flex;
  align-items: center;
  justify-content: center;
}
.workflow-node .node-copy:hover {
  background: var(--bg-hover);
  color: var(--accent);
}

/* ── Concentric diamond ring animation ── */
@keyframes pulseRing {
  0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) rotate(45deg) scale(0.8); }
  50% { opacity: 1; transform: translate(-50%, -50%) rotate(45deg) scale(1.15); }
}

/* ── Connecting line between workflow nodes ── */
.workflow-connector {
  width: 1px;
  height: 10px;
  background: var(--border-hairline);
  margin-left: 17px;
  transition: background 0.3s var(--ease-out-quint);
}
.workflow-connector.active {
  background: var(--accent);
  box-shadow: 0 0 4px var(--accent-glow);
}

/* ── Build / Execution Control (sidebar) ── */
.build-section {
  margin: 8px;
  padding: 10px 12px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-hairline);
  border-radius: 8px;
}
.build-section .section-title {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}
.build-controls {
  display: flex;
  gap: 6px;
  align-items: center;
}
.build-mode-btn {
  flex: 1;
  padding: 6px 10px;
  border: 1px solid var(--border-hairline);
  border-radius: 6px;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 11px;
  font-family: inherit;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s var(--ease-out-quint);
}
.build-mode-btn .mode-indicator {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--text-muted);
}
.build-mode-btn.expert .mode-indicator { background: var(--accent); }
.build-mode-btn.light .mode-indicator { background: var(--text-muted); }
.build-mode-btn:hover { border-color: var(--accent); color: var(--text-primary); }
.build-exec-btn {
  padding: 6px 14px;
  border: none;
  border-radius: 6px;
  background: var(--accent);
  color: var(--bg-surface);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: opacity 0.15s var(--ease-out-quint);
}
.build-exec-btn:hover { opacity: 0.85; }
.build-exec-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── Context Drawer (overlay, v8.2) ── */
.ctx-drawer-backdrop {
  position: fixed; inset: 0; background: var(--overlay);
  z-index: 90; opacity: 0; pointer-events: none;
  transition: opacity 0.25s var(--ease-out-quint);
}
.ctx-drawer-backdrop.open { opacity: 1; pointer-events: auto; }
.ctx-drawer {
  position: fixed; top: 0; right: -400px; width: 380px; height: 100vh;
  background: var(--bg-surface); border-left: 1px solid var(--border-hairline);
  z-index: 100; display: flex; flex-direction: column;
  transition: right 0.3s var(--ease-out-quint);
  box-shadow: -8px 0 30px rgba(0,0,0,0.2);
}
.ctx-drawer.open { right: 0; }
.ctx-drawer-header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; border-bottom: 1px solid var(--border-hairline);
  flex-shrink: 0;
}
.ctx-drawer-title { font-size: 13px; font-weight: 600; flex: 1; }
.ctx-drawer-pct {
  font-family: var(--font-mono); font-size: 12px; font-weight: 600;
  color: var(--accent); background: var(--accent-muted);
  padding: 2px 8px; border-radius: 5px;
}
.ctx-drawer-close {
  width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border-hairline);
  background: transparent; color: var(--text-muted); cursor: pointer;
  font-size: 14px; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.ctx-drawer-close:hover { background: var(--bg-hover); color: var(--text-primary); }
.ctx-drawer-body { flex: 1; overflow-y: auto; padding: 16px; }
.ctx-bar-outer { height: 8px; background: var(--bg-deep); border-radius: 4px; overflow: hidden; margin-bottom: 4px; }
.ctx-bar-inner { height: 100%; border-radius: 4px; background: var(--accent); transition: width 0.5s var(--ease-out-quint), background 0.5s var(--ease-out-quint); }
.ctx-bar-inner.low { background: var(--success); }
.ctx-bar-inner.mid { background: var(--accent); }
.ctx-bar-inner.high { background: var(--warning); }
.ctx-bar-inner.crit { background: var(--error); }
.ctx-bar-label { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); margin-bottom: 12px; }
.ctx-items { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.ctx-item { display: flex; align-items: center; gap: 8px; font-size: 11px; }
.ctx-item-name { width: 100px; flex-shrink: 0; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctx-item-bar { flex: 1; height: 4px; background: var(--bg-deep); border-radius: 2px; overflow: hidden; }
.ctx-item-fill { height: 100%; border-radius: 2px; background: var(--border-hover); }
.ctx-item-val { width: 50px; flex-shrink: 0; text-align: right; font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary); }
.ctx-summary { font-size: 10px; color: var(--text-muted); line-height: 1.5; padding-top: 8px; border-top: 1px solid var(--border-hairline); }
.ctx-suggestions { margin-top: 8px; }
.ctx-suggestions .ctx-sug-item { font-size: 10px; color: var(--text-secondary); padding: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctx-suggestions .ctx-sug-label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 2px; }
.ctx-compressed {
  margin-top: 8px; padding: 6px 8px;
  background: var(--accent-muted); border: 1px solid var(--accent-glow);
  border-radius: 5px; font-size: 10px; color: var(--accent);
}

/* ── Responsive: hide sidebar on narrow screens ── */
@media (max-width: 820px) { .sidebar { display: none; } }
@media (max-width: 640px) { .ctx-drawer { width: 100vw; right: -100vw; } }
</style>
</head>
<body>

<header>
  <div class="logo-mark">C</div>
  <h1>Citrus QA Agent</h1>
  <span class="version-badge" id="versionBadge">v8.4.6</span>
  <div class="header-actions">
    <button class="ctx-circle-btn" id="ctxCircleBtn" onclick="toggleCtxDrawer()" title="上下文用量">
      <svg viewBox="0 0 36 36" width="22" height="22">
        <circle class="ctx-btn-bg" cx="18" cy="18" r="15" />
        <circle class="ctx-btn-fg" id="ctxBtnFg" cx="18" cy="18" r="15" />
      </svg>
    </button>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="切换主题">⊙</button>
    <button class="header-btn" onclick="clearSession()">清空</button>
    <button class="header-btn primary" onclick="newSession()">新会话</button>
  </div>
</header>

<div class="main-container">
  <div class="chat-panel">
    <div id="chat-container">
      <div class="message bot">
        <div class="avatar">◆</div>
        <div class="content">
          您好，我是 <span id="welcomeVersion">Citrus QA Agent v8.4.6</span>。<br>
          <span style="color:var(--text-muted);font-size:13px">本地 RAG 检索 · CrossRef 学术搜索 · 文献综述写作 · 实验设计 · 文件读写</span>
        </div>
      </div>
    </div>

    <footer>
      <div class="input-box">
        <input type="text" id="user-input" placeholder="有什么想做的？" onkeypress="if(event.key==='Enter')sendMsg()">
        <button class="send-btn" id="send-btn" onclick="sendMsg()">发送</button>
      </div>
    </footer>
  </div>

  <div class="sidebar">
    <div class="build-section">
      <div class="section-title">模式切换</div>
      <div class="build-controls">
        <button class="build-mode-btn" id="buildModeBtn" onclick="toggleMode()">
          <span class="mode-indicator"></span>
          <span id="buildModeLabel">专家模式</span>
        </button>
      </div>
    </div>
    <div class="sidebar-section" id="citation-section" style="flex:2">
      <div class="sidebar-header" onclick="toggleSection('citation')">
        <span>文献引用</span>
        <span class="sidebar-count" id="citation-count">0</span>
        <span class="toggle-icon collapsed" id="citation-toggle">▼</span>
      </div>
      <div class="sidebar-content collapsed" id="sidebar-content">
        <div class="empty-sidebar">提交问题后文献将在此展示</div>
      </div>
    </div>
  </div>
</div>

<div class="ctx-drawer-backdrop" id="ctxBackdrop" onclick="toggleCtxDrawer()"></div>
<div class="ctx-drawer" id="ctxDrawer">
  <div class="ctx-drawer-header">
    <span class="ctx-drawer-title">上下文概览</span>
    <span class="ctx-drawer-pct" id="ctx-pct">0%</span>
    <button class="ctx-drawer-close" onclick="toggleCtxDrawer()">✕</button>
  </div>
  <div class="ctx-drawer-body">
    <div class="empty-sidebar" id="ctx-empty">等待首次查询...</div>
    <div id="ctx-body" style="display:none">
      <div class="ctx-bar-outer"><div class="ctx-bar-inner" id="ctxBar"></div></div>
      <div class="ctx-bar-label" id="ctxBarLabel">0 / 64,000</div>
      <div class="ctx-items" id="ctxItems"></div>
      <div class="ctx-summary" id="ctxSummary"></div>
      <div class="ctx-suggestions" id="ctxSuggestions"></div>
      <div class="ctx-compressed" id="ctxCompressed" style="display:none"></div>
    </div>
  </div>
</div>


<script>
var API_URL = '/api/v2/chat';
var sessionId = localStorage.getItem('citrus_session_id');
var chatContainer = document.getElementById('chat-container');
var userInput = document.getElementById('user-input');
var sendBtn = document.getElementById('send-btn');
var sidebarContent = document.getElementById('sidebar-content');
var citationCount = document.getElementById('citation-count');
var roundHistory = [];
var currentRoundId = 0;
var currentQuery = '';
var totalTokens = 0;
var _agentTokenBuffer = '';
var _agentTokenName = '';

if (typeof marked === 'undefined') window.marked = { parse: function(t) { return t; } };
marked.setOptions({ breaks: true });

/* ─── XSS 防护: 所有动态文本入 innerHTML 前转义 (v8.3.3) ─── */
function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
/* v8.4.3: 代码块内容只转义 & < >（引号安全——处于 <pre><code> 标签内部，
   全量转义会把代码里的 ' 显示成 &#39;，如 5'上游调控区） */
function escapeHtmlCode(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function renderMarkdownSafe(text) {
  var renderer = new marked.Renderer();
  var origCode = renderer.code;
  renderer.code = function(code, lang) {
    // v8.4.6: 兼容 marked>=5 的 token 对象签名（code 可能为 {text:...}），
    // 否则代码块会渲染成 "[object Object]"
    if (code && typeof code === 'object') { lang = code.lang || ''; code = code.text || ''; }
    var cls = lang ? ' class="lang-' + escapeHtml(lang) + '"' : '';
    return '<pre><code' + cls + '>' + escapeHtmlCode(code) + '</code></pre>';
  };
  renderer.codespan = function(code) {
    if (code && typeof code === 'object') { code = code.text || ''; }
    return '<code>' + escapeHtmlCode(code) + '</code>';
  };
  return marked.parse(String(text == null ? '' : text), { renderer: renderer, breaks: true });
}

/* ─── v8.4.3: 运行时配置（上下文预算/权限模式单一来源，删本地硬编码）─── */
var _runtimeConfig = null;
var _lastStreamOnce = null;   /* 权限授权后重放当前请求的钩子 */
var _pendingPermission = null;
function _ctxMaxTokens() {
  if (_runtimeConfig && _runtimeConfig.context && _runtimeConfig.context.max_tokens) {
    return _runtimeConfig.context.max_tokens;
  }
  return 1000000;
}
function loadRuntimeConfig() {
  fetch('/api/v2/config').then(function(r) { return r.json(); })
    .then(function(cfg) { _runtimeConfig = cfg; applyAppVersion(); })
    .catch(function() { applyAppVersion(); });
}
/* v8.4.5: 版本单源——后端 /api/v2/config.version 下发，静态文案仅为离线回退 */
function _appVersion() {
  return (_runtimeConfig && _runtimeConfig.version) || '8.4.6';
}
function applyAppVersion() {
  var v = _appVersion();
  var badge = document.getElementById('versionBadge');
  if (badge) badge.textContent = 'v' + v;
  var w = document.getElementById('welcomeVersion');
  if (w) w.textContent = 'Citrus QA Agent v' + v;
  if (document.title) document.title = document.title.replace(/v\d+(\.\d+)+/, 'v' + v);
}
loadRuntimeConfig();

/* ─── v8.4.3: 权限审批卡片（授权动作不写入对话历史）─── */
function showPermissionCard(data) {
  _pendingPermission = data;
  var existing = document.getElementById('permission-card');
  if (existing) existing.remove();
  var card = document.createElement('div');
  card.id = 'permission-card';
  card.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:9999;max-width:360px;' +
    'background:var(--bg-card,#1e2430);border:1px solid rgba(255,180,0,.5);border-radius:10px;' +
    'padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.45);font-size:13px';
  var tool = data.tool_name || '工具';
  var args = data.args || {};
  var argText = Object.keys(args).map(function(k) { return k + ': ' + String(args[k]).substring(0, 120); }).join('<br>');
  card.innerHTML =
    '<div style="font-weight:600;color:#ffb347;margin-bottom:6px">⚠ 权限确认</div>' +
    '<div style="margin-bottom:4px">工具: <code>' + escapeHtml(tool) + '</code></div>' +
    (argText ? '<div style="color:var(--text-muted);margin-bottom:10px;word-break:break-all">' + argText + '</div>' : '') +
    '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
    '<button class="need-complex-btn" data-scope="once">允许本次</button>' +
    '<button class="need-complex-btn" data-scope="session">本会话允许</button>' +
    '<button class="need-complex-btn" data-scope="workspace">始终允许工作区</button>' +
    '</div>';
  card.querySelectorAll('button').forEach(function(btn) {
    btn.onclick = function() {
      grantPermission(tool, btn.getAttribute('data-scope'));
    };
  });
  document.body.appendChild(card);
}

function grantPermission(toolName, scope) {
  fetch('/api/v2/permission/grant', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_id: sessionId, tool_name: toolName, scope: scope }),
  }).then(function(r) { return r.json(); }).then(function() {
    var card = document.getElementById('permission-card');
    if (card) card.remove();
    _pendingPermission = null;
    if (_lastStreamOnce) _lastStreamOnce();   /* 授权后重放同请求（幂等不重复写历史） */
  }).catch(function(e) { alert('授权失败: ' + e.message); });
}

/* ─── Theme ─── */
(function() {
  var t = localStorage.getItem('citrus_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', t);
})();

function toggleTheme() {
  var html = document.documentElement;
  var cur = html.getAttribute('data-theme');
  var next = cur === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('citrus_theme', next);
}

/* ─── AbortController for SSE (cancel inflight on new send) ─── */
var currentAbortController = null;

/* ─── Plan Mode state (synced from server flags) ─── */
var planModeEnabled = true;

/* ─── Mode (Expert / Light) ─── */
var currentMode = localStorage.getItem('citrus_mode') || 'expert';

function updateModeUI() {
  var buildBtn = document.getElementById('buildModeBtn');
  var buildLabel = document.getElementById('buildModeLabel');
  var isLight = currentMode === 'light';
  if (buildBtn) { buildBtn.className = 'build-mode-btn ' + (isLight ? 'light' : 'expert'); }
  if (buildLabel) { buildLabel.textContent = isLight ? '轻量模式' : '专家模式'; }
}

function executeBuild() {
  var input = document.getElementById('user-input');
  if (input && input.value.trim()) { sendMsg(); }
}
function setSendDisabled(val) {
  var btn = document.getElementById('send-btn');
  var exec = document.getElementById('buildExecBtn');
  if (btn) btn.disabled = val;
  if (exec) exec.disabled = val;
}

var togglingMode = false;
function toggleMode() {
  if (togglingMode) return;
  togglingMode = true;
  var next = currentMode === 'expert' ? 'light' : 'expert';
  // v8.3.1: 模式由前端决定（请求体 light_mode），后端无自动升级；移除无效 flags 调用
  currentMode = next;
  localStorage.setItem('citrus_mode', currentMode);
  updateModeUI();
  togglingMode = false;
}

(function() { updateModeUI(); })();

/* ─── Sidebar ─── */
function toggleSection(section) {
  var map = { citation: 'sidebar-content' };
  var el = document.getElementById(map[section]);
  var icon = document.getElementById(section + '-toggle');
  el.classList.toggle('collapsed');
  icon.classList.toggle('collapsed');
}

/* ─── Context Drawer ─── */
var _ctxData = null;
var _totalTokensUsed = 0;
var CTX_BTN_R = 15;
var CTX_BTN_CIRCUM = 2 * Math.PI * CTX_BTN_R;

function toggleCtxDrawer() {
  var drawer = document.getElementById('ctxDrawer');
  var backdrop = document.getElementById('ctxBackdrop');
  drawer.classList.toggle('open');
  backdrop.classList.toggle('open');
}

function _ctxLevelClass(pct) {
  if (pct < 0.70) return 'low';
  if (pct < 0.85) return 'mid';
  if (pct < 0.93) return 'high';
  return 'crit';
}

function _updateCtxBtnRing(pct) {
  var lvl = _ctxLevelClass(pct);
  var fg = document.getElementById('ctxBtnFg');
  var dash = CTX_BTN_CIRCUM * (1 - Math.min(pct, 1));
  fg.style.strokeDasharray = CTX_BTN_CIRCUM + ' ' + CTX_BTN_CIRCUM;
  fg.style.strokeDashoffset = dash;
  fg.className = 'ctx-btn-fg ' + lvl;
}

function renderContextPanel(data) {
  _ctxData = data;
  var est = data.estimated_tokens || 0;
  var max = data.max_tokens || _ctxMaxTokens();
  var pct = max > 0 ? est / max : 0;

  _updateCtxBtnRing(pct);

  var emptyEl = document.getElementById('ctx-empty');
  var bodyEl = document.getElementById('ctx-body');
  if (emptyEl) emptyEl.style.display = 'none';
  if (bodyEl) bodyEl.style.display = '';

  var lvl = _ctxLevelClass(pct);
  var bar = document.getElementById('ctxBar');
  var barLabel = document.getElementById('ctxBarLabel');
  if (bar) { bar.style.width = Math.round(pct * 100) + '%'; bar.className = 'ctx-bar-inner ' + lvl; }
  if (barLabel) barLabel.textContent = est.toLocaleString() + ' / ' + max.toLocaleString();
  var pctEl = document.getElementById('ctx-pct');
  if (pctEl) pctEl.textContent = Math.round(pct * 100) + '%';

  var items = [];
  if (est <= 0) {
    items.push({ name: '新会话（无历史消息）', tok: 1 });
    items.push({ name: '等待首次检索填充上下文...', tok: 0 });
  } else {
    var totalForBars = Math.max(est, 1);
    items.push({ name: '系统提示词', tok: Math.round(totalForBars * 0.12) });
    items.push({ name: '对话历史 (' + (data.history_msgs || 0) + '轮)', tok: Math.round(totalForBars * 0.42) });
    if (data.ltm_recalled) {
      items.push({ name: '长期记忆', tok: Math.round(totalForBars * 0.06) });
    }
    var sugCount = (data.suggestions || []).length;
    if (data.ltm_chars > 0 || sugCount > 0) {
      items.push({ name: '检索上下文', tok: Math.round(totalForBars * 0.30) });
    }
    items.push({ name: '其他开销', tok: Math.round(totalForBars * 0.10) });
  }

  var itemsHtml = '';
  var totalForBars = items.reduce(function(s, i) { return s + i.tok; }, 0) || 1;
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    itemsHtml += '<div class="ctx-item">';
    itemsHtml += '<span class="ctx-item-name">' + it.name + '</span>';
    itemsHtml += '<div class="ctx-item-bar"><div class="ctx-item-fill" style="width:' + Math.round(it.tok / totalForBars * 100) + '%"></div></div>';
    itemsHtml += '<span class="ctx-item-val">' + it.tok.toLocaleString() + '</span>';
    itemsHtml += '</div>';
  }
  var itemsEl = document.getElementById('ctxItems');
  if (itemsEl) {
    // P3-3: 明细为按初始估算的比例切分（占比可视化），标注说明避免误读为真实测量
    itemsHtml = '<div class="ctx-item-hint" style="font-size:10px;color:var(--text-muted);opacity:.75;margin-bottom:4px">明细为占比估算，顶部为实际用量</div>' + itemsHtml;
    itemsEl.innerHTML = itemsHtml;
  }

  var soft = data.soft_threshold || 0.75;
  var hard = data.hard_threshold || 0.93;
  var sumEl = document.getElementById('ctxSummary');
  if (sumEl) sumEl.innerHTML =
    '剩余 <b>' + (max - est).toLocaleString() + '</b> tokens' +
    '  ·  ' + '压缩 <b>' + Math.round(soft * 100) + '%</b> / ' + Math.round(hard * 100) + '%';

  var sugEl = document.getElementById('ctxSuggestions');
  if (sugEl) {
    if (data.format_hint) {
      sugEl.innerHTML = '<div class="ctx-sug-label">格式提示</div><div class="ctx-sug-item">' + data.format_hint + '</div>';
    } else {
      sugEl.innerHTML = '';
    }
    if (data.suggestions && data.suggestions.length > 0) {
      var sugHtml = sugEl.innerHTML;
      sugHtml += '<div class="ctx-sug-label" style="margin-top:4px">搜索建议</div>';
      for (var si = 0; si < data.suggestions.length; si++) {
        sugHtml += '<div class="ctx-sug-item">· ' + data.suggestions[si] + '</div>';
      }
      sugEl.innerHTML = sugHtml;
    }
  }

  var compEl = document.getElementById('ctxCompressed');
  if (compEl) {
    if (data.compressed) {
      compEl.style.display = '';
      compEl.innerHTML = '⚡ 上下文已压缩 (' + (data.compression_len || 0) + ' 字摘要)';
    } else {
      compEl.style.display = 'none';
    }
  }
}

  function handleStatusEvent(data) {
    // v8.3.5: status 事件显式化（step 进度 / budget_skip / circuit_breaker / planning）
    var stage = data.stage || '';
    var msg = data.message || '';
    var stepNames = {load:'加载会话上下文', retrieve:'检索文献', supervise:'分析中', answer:'生成回答'};
    if (stage === 'budget_skip' || stage === 'circuit_breaker') {
      appendTerminal('⚠ ' + msg);
      updateStatus('tool', msg);
    } else if (stage === 'planning') {
      updateStatus('answer', msg || '正在规划结构...');
    } else if (stage === 'final_answer') {
      updateStatus('answer', '生成最终答案...');
    } else if (stage === 'step_active') {
      updateStatus('tool', (stepNames[data.step_id] || data.step_id) + '...');
    } else if (stage === 'step_done') {
      updateStatus('tool', (stepNames[data.step_id] || data.step_id) + '完成');
    } else if (stage === 'agent_start') {
      updateStatus('agent', '启动子Agent: ' + (data.agent || ''));
    } else if (stage === 'retrieval_done') {
      // v8.4.6 F1: light 模式代码级预检索完成
      updateStatus('tool', '预检索完成 (' + (data.main_count||0) + ' 篇)');
      appendTerminal('✓ 预检索完成 · 通过阈值 ' + (data.main_count||0) + ' 篇');
    }
  }

  function updateContextTokens(extraTokens) {
  // v8.3.1: 入参即 token 数（调用方自行折算字符→token；context_usage 事件传真实 token）
  _totalTokensUsed += (extraTokens || 0);
  if (!_ctxData) return;
  var max = _ctxData.max_tokens || _ctxMaxTokens();
  var est = (_ctxData.estimated_tokens || 0) + Math.round(_totalTokensUsed);
  var pct = max > 0 ? Math.min(est / max, 1) : 0;

  _updateCtxBtnRing(pct);
  var pctEl = document.getElementById('ctx-pct');
  if (pctEl) pctEl.textContent = Math.round(pct * 100) + '%';

  var bar = document.getElementById('ctxBar');
  if (bar) { bar.style.width = Math.round(pct * 100) + '%'; bar.className = 'ctx-bar-inner ' + _ctxLevelClass(pct); }
  var barLabel = document.getElementById('ctxBarLabel');
  if (barLabel) barLabel.textContent = Math.round(est).toLocaleString() + ' / ' + max.toLocaleString();

  // P3-1: 同步"剩余 tokens / 压缩阈值"文本（此前只更新顶部 bar，剩余文本停在初始 est 造成 15% vs 99% 矛盾）
  var sumEl = document.getElementById('ctxSummary');
  if (sumEl) {
    var soft = _ctxData.soft_threshold || 0.75;
    var hard = _ctxData.hard_threshold || 0.93;
    sumEl.innerHTML = '剩余 <b>' + Math.max(max - est, 0).toLocaleString() + '</b> tokens' +
      '  ·  ' + '压缩 <b>' + Math.round(soft * 100) + '%</b> / ' + Math.round(hard * 100) + '%';
  }
}


/* ─── Chat ─── */
function addMessage(role, html) {
  var div = document.createElement('div');
  div.className = 'message ' + role;
  div.innerHTML = '<div class="avatar">' + (role === 'user' ? '→' : '◆') + '</div><div class="content">' + html + '</div>';
  chatContainer.appendChild(div);
  chatContainer.scrollTop = chatContainer.scrollHeight;
  return div.querySelector('.content');
}

async function clearSession() {
  if (!confirm('确定清空当前会话？')) return;
  try {
    await fetch('/api/v1/session/' + sessionId + '/clear', { method: 'POST' });
    chatContainer.innerHTML = '<div class="message bot"><div class="avatar">◆</div><div class="content">您好，我是 <span id="welcomeVersion">Citrus QA Agent v' + _appVersion() + '</span>。<br><span style="color:var(--text-muted);font-size:13px">本地 RAG 检索 · CrossRef 学术搜索 · 文献综述写作 · 实验设计 · 文件读写</span></div></div>';
    sidebarContent.innerHTML = '<div class="empty-sidebar">提交问题后文献将在此展示</div>';
    citationCount.textContent = '0';
    roundHistory = [];
    // P3-2: 重置上下文面板（清空后不再残留旧会话数字）
    _ctxData = null;
    _totalTokensUsed = 0;
    renderContextPanel({ estimated_tokens: 0, max_tokens: _ctxMaxTokens(), history_msgs: 0,
                         soft_threshold: 0.75, hard_threshold: 0.93 });
  } catch (e) { alert('清空失败: ' + e.message); }
}

async function newSession() {
  try {
    var resp = await fetch('/api/v1/session/new', { method: 'POST' });
    var data = await resp.json();
    sessionId = data.session_id;
    localStorage.setItem('citrus_session_id', sessionId);
    await clearSession();
  } catch (e) { alert('创建新会话失败: ' + e.message); }
}

function toggleRound(id) {
  var body = document.getElementById(id);
  var icon = document.getElementById(id + '-icon');
  body.style.display = body.style.display === 'none' ? 'block' : 'none';
  icon.classList.toggle('collapsed');
}

async function sendMsg(isFollowUp) {
  if (isFollowUp === undefined) isFollowUp = false;
  var query = userInput.value.trim();
  if (!query) return;

  // v8.3.7 M1: 每次点击生成稳定幂等 ID，重试复用（防重发重复写历史）
  var clientRequestId = 'crid-' + Date.now().toString(36) + '-' +
    Math.random().toString(36).slice(2, 10);

  currentRoundId++;
  currentQuery = query;
  _ctxData = null;
  _totalTokensUsed = 0;

  addMessage('user', query);
  userInput.value = '';
  setSendDisabled(true);

  var botContent = addMessage('bot', '');
  var isCancelled = false;

  var _timeoutMs = currentMode === 'light' ? 120000 : 300000;
  var spinnerTimeout = setTimeout(function() {
    if (!isCancelled) { isCancelled = true; setSendDisabled(false); }
  }, _timeoutMs);

  /* ── status (opencode style: single line, expandable terminal) ── */
  var statusDiv = document.createElement('div');
  statusDiv.innerHTML = '<div class="exec-status" onclick="var t=document.getElementById(\'terminal_' + currentRoundId + '\'); if(t){t.style.display=t.style.display==\'none\'?\'block\':\'none\'}">◆ 思考中...<span class="tool-subtitle"></span></div>';
  var termId = 'terminal_' + currentRoundId;
  var termLog = document.createElement('div');
  termLog.id = termId;
  termLog.className = 'terminal-log';
  termLog.style.display = 'none';
  botContent.appendChild(statusDiv);
  botContent.appendChild(termLog);

  var answerDiv = document.createElement('div');
  answerDiv.style.display = 'none';

  var citationsDiv = document.createElement('div');
  citationsDiv.style.display = 'none';

  botContent.appendChild(statusDiv);
  botContent.appendChild(answerDiv);
  botContent.appendChild(citationsDiv);

  var fullText = '';
  var isAnswerStarted = false;
  var renderPending = false;

  var _icons = {thinking: '💭', tool: '⚙', agent: '◆', answer: '✍'};

  function updateStatus(type, text) {
    var icon = _icons[type] || '•';
    var safeText = escapeHtml(text);
    var subtitle = text.length > 30 ? ' <span class="tool-subtitle">' + safeText + '</span>' : '';
    statusDiv.innerHTML = '<div class="exec-status" onclick="var t=document.getElementById(\'' + termId + '\'); if(t){t.style.display=t.style.display==\'none\'?\'block\':\'none\'}">' + icon + ' ' + safeText.split('.')[0] + '...' + subtitle + '</div>';
  }

  function appendTerminal(msg) {
    var t = new Date();
    var ts = t.getHours().toString().padStart(2,'0') + ':' + t.getMinutes().toString().padStart(2,'0') + ':' + t.getSeconds().toString().padStart(2,'0');
    var entry = document.createElement('div');
    entry.className = 'term-line';
    entry.innerHTML = '<span class="term-time">[' + ts + ']</span> <span class="term-msg">' + msg.replace(/</g,'&lt;') + '</span>';
    termLog.appendChild(entry);
    if (termLog.children.length > 50) termLog.removeChild(termLog.firstChild);
    termLog.scrollTop = termLog.scrollHeight;
  }

  function clearStatus() {
    statusDiv.innerHTML = '';
    termLog.style.display = 'none';
  }

  function renderAnswer() {
    if (!renderPending) {
      renderPending = true;
      requestAnimationFrame(function() {
        var s = fullText.replace(/__NEED_COMPLEX__/g, '');
        var frx = /---\s*\*\*.. \u6df1\u5165\u63a2\u7d22.*?\*\*([\s\S]*?)$/;
        var m = s.match(frx);
        var main = s;
        var qs = [];
        if (m) { main = s.replace(frx, '').trim();
          var qb = m[1]; var ql = qb.split('\n');
          for (var qi = 0; qi < ql.length; qi++) {
            var q = ql[qi].trim().replace(/^\d+\.\s*/, '');
            if (q) qs.push(q);
          }
        }
        answerDiv.innerHTML = renderMarkdownSafe(main);
        if (qs.length > 0) {
          var cc = document.createElement('div'); cc.className = 'follow-up-container';
          var cl = document.createElement('div'); cl.className = 'follow-up-label'; cl.textContent = '深入探索（点击追问）'; cc.appendChild(cl);
          var cd = document.createElement('div'); cd.className = 'follow-up-chips';
          for (var qi = 0; qi < qs.length; qi++) { (function(qt){var c=document.createElement('button');c.className='follow-up-chip';c.textContent=qt;c.onclick=function(){handleSendFollowUp(qt)};cd.appendChild(c)})(qs[qi]); }
          cc.appendChild(cd); answerDiv.appendChild(cc);
        }
        chatContainer.scrollTop = chatContainer.scrollHeight; renderPending = false;
      });
    }
  }

  function handleSendFollowUp(q) { userInput.value = q; sendMsg(true); }

  function showBanner(msg) {
    var b = document.getElementById('degraded-banner');
    if (!b) {
      b = document.createElement('div');
      b.id = 'degraded-banner';
      b.style.cssText = 'margin:8px auto;max-width:760px;padding:8px 12px;border-radius:6px;' +
        'background:rgba(255,180,0,.12);border:1px solid rgba(255,180,0,.4);color:#d9a441;font-size:13px';
      var sc = document.getElementById('chatContainer') || chatContainer;
      sc.parentNode.insertBefore(b, sc);
    }
    b.textContent = msg;
    b.style.display = '';
    clearTimeout(showBanner._t);
    showBanner._t = setTimeout(function () { b.style.display = 'none'; }, 8000);
  }

  function handleEvent(type, data) {
    switch (type) {
      case 'thinking': updateStatus('thinking', (data.content||'').substring(0,80)); updateContextTokens(((data.content||'').length)*0.7); break;
      case 'tool_call_start': updateStatus('tool', (data.tool_name||'工具')+' 执行中...'); updateContextTokens(30); break;
      case 'tool_executing': updateStatus('tool', data.message||'执行中...'); break;
      case 'tool_progress': updateStatus('tool', data.message||''); break;
      case 'tool_result':
        updateContextTokens((data.output||'').length * 0.7);
        // v8.4.6 F3: 执行日志层级化——工具完成打一行汇总，不再逐条刷内部进度
        appendTerminal('✓ ' + (data.tool_name||'工具') + ' · ' + (data.summary||'完成'));
        break;
      case 'agent_switch':
        updateStatus('agent', '启动: '+(data.agent_name||'')); updateContextTokens(50);
        appendTerminal('── 子Agent「' + (data.agent_name||'') + '」启动 ── ' + (data.task||''));
        break;
      case 'text':
        if (!isAnswerStarted) { isAnswerStarted=true; clearTimeout(spinnerTimeout); updateStatus('answer','生成回答中...'); answerDiv.style.display=''; }
        fullText+=data.content; updateContextTokens((data.content||'').length * 0.7); renderAnswer(); break;
      case 'token':
        if (!isAnswerStarted) { isAnswerStarted=true; clearTimeout(spinnerTimeout); updateStatus('answer','生成回答中...'); answerDiv.style.display=''; }
        fullText+=data.content; updateContextTokens((data.content||'').length * 0.7); renderAnswer(); break;
      case 'context_status': renderContextPanel(data); break;
      case 'status': handleStatusEvent(data); break;
      case 'context_usage': updateContextTokens((data.delta != null ? data.delta : data.total) || 0); break;
      case 'context_degraded': showBanner('⚠️ 历史会话加载失败，本次回答可能缺少上下文'); break;
      case 'permission_request':
        showPermissionCard(data);
        appendTerminal('⚠ 工具 ' + (data.tool_name || '') + ' 需要权限确认（已弹出审批卡片）');
        break;
      case 'plan_ready':
        updateStatus('answer', '📑 大纲已生成 (' + (data.sections||[]).length + ' 章)，开始逐章撰写...');
        appendTerminal('📑 大纲: ' + (data.title||'') + ' | 章节: ' + (data.sections||[]).join(' → '));
        break;
      case 'section_start':
        updateStatus('answer', '✍️ 正在写第 ' + (data.index||'') + '/' + (data.total||'') + ' 章: ' + (data.heading||''));
        break;
      case 'section_done':
        updateStatus('answer', '✅ 第 ' + (data.index||'') + '/' + (data.total||'') + ' 章完成');
        break;
      case 'citations':
        roundHistory.push({roundId:currentRoundId,query:currentQuery,cited:data.cited||[],uncited:data.uncited||[],historical:data.historical||[]});
        renderRoundSidebar(); citationsDiv.style.display='';
        var cited=data.cited||[];
        if (cited.length>0) {
          var c=document.createElement('div'); c.style.cssText='margin-top:10px;padding-top:10px;border-top:1px solid var(--border-hairline)';
          c.innerHTML='<div style="font-size:11px;color:var(--text-muted);margin-bottom:5px">引用 ('+cited.length+'篇)</div>';
          for (var k=0;k<cited.length;k++) c.innerHTML+='<span style="display:inline-block;font-family:var(--font-mono);font-size:10px;background:var(--success-glow);color:var(--success);padding:1px 5px;border-radius:3px;margin:2px;font-weight:600">['+escapeHtml(cited[k].ref_id)+']</span>';
          citationsDiv.appendChild(c);
        }
        break;
      case 'done':
        clearTimeout(spinnerTimeout); isCancelled=true; answerDiv.style.display=''; clearStatus();
        // v8.3.7 M3: 引用无检索支撑 → 轻提示（不阻断回答）
        if (data.citation_unsupported) {
          showBanner('⚠ 回答包含文献引用，但本轮未检测到检索支撑（可能为模型记忆），请谨慎引用');
        } else if (data.citation_mismatch) {
          showBanner('⚠ 回答引用编号(' + (data.citation_count||0) + ')多于检索文献(' + (data.retrieval_count||0) + ')');
        }
        if (!fullText&&data.answer) fullText=data.answer;
        if (fullText) answerDiv.innerHTML=renderMarkdownSafe(fullText.replace(/__NEED_COMPLEX__/g,''));
        if (fullText.indexOf('__NEED_COMPLEX__')>=0) {
          var uc=document.createElement('div');uc.style.cssText='margin-top:12px;text-align:center';
          var ub=document.createElement('button');ub.className='need-complex-btn';ub.textContent='信息不足，切换到专家模式深入检索';
          ub.onclick=function(){planModeEnabled=true;currentMode='expert';localStorage.setItem('citrus_mode','expert');updateModeUI();userInput.value=currentQuery;sendMsg()};
          uc.appendChild(ub);botContent.appendChild(uc);
        }
        var s=(data.gen_time_ms/1000).toFixed(1);
        var td=document.createElement('div');td.style.cssText='margin-top:8px;font-size:11px;color:var(--text-muted);font-family:var(--font-mono)';td.textContent='⏱ '+s+'s';botContent.appendChild(td);
        sessionId=data.session_id;if(sessionId)localStorage.setItem('citrus_session_id',sessionId);
        setSendDisabled(false);userInput.focus();break;
      case 'error':
        clearTimeout(spinnerTimeout);isCancelled=true;setSendDisabled(false);userInput.focus();
        if(!fullText){clearStatus();answerDiv.style.display='';answerDiv.innerHTML='<div style="color:var(--error);font-weight:500">⚠ 请求出错: '+(data.message||'未知错误')+'</div>';}
        break;
      case 'heartbeat': break;
      default: break;
    }
  }

  function streamOnce() {
    /* v8.4.3: 权限授权后重放同一请求（同 clientRequestId → 服务端幂等不重复写历史） */
    fullText = '';
    isAnswerStarted = false;
    renderPending = false;
    answerDiv.style.display = 'none';
    answerDiv.innerHTML = '';
    statusDiv.innerHTML = '';
    termLog.style.display = 'none';

    if (currentAbortController) currentAbortController.abort();
    currentAbortController = new AbortController();

    (async function() {
      try {
        var response = await fetch(API_URL, {method:'POST',headers:{'Content-Type':'application/json'},signal:currentAbortController.signal,body:JSON.stringify({session_id:sessionId,query:query,client_request_id:clientRequestId,light_mode:currentMode==='light'})});
        if (!response.ok) { clearTimeout(spinnerTimeout);isCancelled=true;clearStatus();answerDiv.style.display='';answerDiv.innerHTML='<div style="color:var(--error);font-weight:500">⚠ 服务器错误 ('+response.status+')</div>';setSendDisabled(false);userInput.focus();return; }
        var reader=response.body.getReader(),decoder=new TextDecoder(),buffer='',curEvt='message';
        while(true){var chunk=await reader.read();if(chunk.done)break;buffer+=decoder.decode(chunk.value,{stream:true});var lines=buffer.split('\n');buffer=lines.pop();
          for(var j=0;j<lines.length;j++){var line=lines[j];
            if(line.startsWith('event: '))curEvt=line.substring(7).trim();
            else if(line.startsWith('data: ')){try{var d=JSON.parse(line.substring(6));try{handleEvent(curEvt,d)}catch(_){}}catch(_){}}
            else if(line.trim()==='')curEvt='message';
          }
        }
      } catch(err){if(err.name!=='AbortError'){clearTimeout(spinnerTimeout);isCancelled=true;clearStatus();answerDiv.style.display='';answerDiv.innerHTML='<span style="color:var(--error)">请求失败: '+err+'</span>';setSendDisabled(false);}}
      finally{if(currentAbortController)currentAbortController=null;}
    })();
  }

  /* v8.4.3: 权限重放钩子（permission_request 授权后由全局函数调用） */
  _lastStreamOnce = streamOnce;
  streamOnce();

  function renderCitationItem(item){var du=item.doi&&item.doi!=='N/A'?'https://doi.org/'+encodeURIComponent(item.doi):'#';var b=item.type==='main'?'citation-badge':item.type==='dynamic'?'citation-badge uncited':'citation-badge uncited';var sl=item.type==='dynamic'?'Agent 发现':item.type==='web'?'Web':item.type==='historical'?'历史证据':(item.score?'CE='+item.score.toFixed(3):'');var h='<div class="citation-item" onclick="this.classList.toggle(\'expanded\')">';h+='<div class="citation-header"><span class="'+b+'">['+escapeHtml(item.ref_id)+']</span><span class="citation-score">'+escapeHtml(sl)+'</span></div>';if(item.type==='web'){if(item.url)h+='<a href="'+escapeHtml(item.url)+'" target="_blank" class="citation-doi" onclick="event.stopPropagation()">'+escapeHtml(item.url)+'</a>'}else if(item.doi&&item.doi!=='N/A'){h+='<a href="'+du+'" target="_blank" class="citation-doi" onclick="event.stopPropagation()">'+escapeHtml(item.doi)+'</a>'}if(item.section_name)h+='<div class="citation-text"><strong>Section:</strong> '+escapeHtml(item.section_name)+'</div>';if(item.text_preview)h+='<div class="citation-text">'+escapeHtml((item.text_preview||'').substring(0,250))+'</div>';h+='<div class="citation-detail">';if(item.title)h+='<div class="citation-text"><strong>Title:</strong> '+escapeHtml((item.title||'').substring(0,200))+'</div>';if(item.authors)h+='<div class="citation-text"><strong>Authors:</strong> '+escapeHtml(item.authors)+'</div>';if(item.year)h+='<div class="citation-text"><strong>Year:</strong> '+escapeHtml(item.year)+'</div>';if(item.chunk_id)h+='<div class="citation-text"><strong>Chunk:</strong> '+escapeHtml(item.chunk_id)+'</div>';h+='</div></div>';return h}
  function renderRoundSidebar(){if(roundHistory.length===0){sidebarContent.innerHTML='<div class="empty-sidebar">提交问题后文献将在此展示</div>';citationCount.textContent='0';return}var tC=0,tU=0;for(var i=0;i<roundHistory.length;i++){tC+=roundHistory[i].cited.length;tU+=roundHistory[i].uncited.length}citationCount.textContent=(tC+tU);var html='';for(var i=roundHistory.length-1;i>=0;i--){var round=roundHistory[i];var all=[];for(var k=0;k<round.cited.length;k++){if(round.cited[k].type!=='web')all.push(round.cited[k])}for(var k=0;k<round.uncited.length;k++){if(round.uncited[k].type!=='web')all.push(round.uncited[k])}for(var k=0;k<(round.historical||[]).length;k++){all.push(round.historical[k])}if(all.length===0)continue;var qp=round.query.length>25?round.query.substring(0,25)+'...':round.query;var open=i===roundHistory.length-1;html+='<div class="round-group">';html+='<div class="round-header" onclick="toggleRound(\'round-'+round.roundId+'\')">';html+='<span class="toggle-icon" id="round-'+round.roundId+'-icon">▶</span>';html+='<span class="round-title">Round '+round.roundId+': '+qp+'</span>';html+='<span class="round-count">'+all.length+'</span></div>';html+='<div class="round-body" id="round-'+round.roundId+'"'+(open?'':' style="display:none"')+'>';for(var m=0;m<all.length;m++){html+=renderCitationItem(all[m])}html+='</div></div>'}sidebarContent.innerHTML=html||'<div class="empty-sidebar">本轮未检索到相关文献</div>'}
  }

if (sessionId) { userInput.focus(); }
</script>
