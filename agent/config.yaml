# GSRA: Graph-Structured Retrieval Agent 配置文件
# 优先级: 环境变量 > YAML > pydantic-settings 默认值

retrieval:
  backend: lancedb            # v8.13-b5b: 全项目数据源重定向——lancedb 统一承载新旧数据包（无锁/热更新）
  top_k_vector: 40          # 向量检索每批取回数量
  top_k_bm25: 40            # BM25 检索取回数量
  top_k_final: 10           # Rerank 后最终保留数量
  rrf_k: 60                 # RRF 融合常数
  rrf_weights:
    orig_dense: 1.0          # original_query 向量检索权重
    hyde_dense: 1.0          # HyDE 假想答案向量检索权重
    bm25: 1.0                # BM25 词法检索权重
  rerank_threshold: 0.25    # Sigmoid 概率绝对底线阈值（RAG 与 HyDE 路一致，动态阈值 = max(0.25, top×ratio)）
  dynamic_threshold_ratio: 0.60  # 动态阈值 = top_score * ratio
  web_relevance_threshold: 0.3   # Web 语义过滤阈值（BGE reranker 分数，0=不相关 1=完美匹配）
  rag_hyde_enabled: true         # HyDE: 本地RAG检索前生成英文假想答案提升召回
  hyde_max_tokens: 512           # HyDE 假想答案输出上限（与 prompt 250词约束配套，防截断）

# 学术搜索配置（CrossRef/PubMed/Semantic Scholar/OpenAlex）
# 根据网络状况选择性启用。大陆网络 PubMed 稳定；其余源无摘要或需外网，默认关闭。
academic_search:
  enabled_sources: ["pubmed"]  # 仅 PubMed：有摘要+MeSH；CrossRef 无摘要无全文，已移除
  timeout_per_source: 5  # 单源超时秒数

model:
  main: "deepseek-v4-flash"   # v8.3.1: 全部切换 Flash 正式版（V4 Pro 已移除）
  fast: "deepseek-v4-flash"
  embedding: "intfloat/multilingual-e5-large"
  reranker: "BAAI/bge-reranker-v2-m3"

embedder:
  force_cpu: false          # 强制 CPU（调试用）
  # offline_mode: true     # 默认离线(大陆推荐)。改为 false 或设 HF_HUB_OFFLINE=0 可连 HuggingFace 检查更新

onnx:
  provider_priority:
    - "DmlExecutionProvider"
    - "CUDAExecutionProvider"
    - "CPUExecutionProvider"

# ── Compute Scheduler ──
compute:
  prefer_device: "auto"       # auto / directml / cuda / cpu
  fallback_to_cpu: true
  dml_device_id: 0
  cuda_device_id: 0

react:
  max_steps: 5

logging:
  level: "INFO"
  dir: "logs"

chat:
  temperature_main: 0.2
    # 主模型（deepseek-chat）生成温度。值越大回答越随机。
    # 当前 0.2 偏保守，适合科研回答需事实准确性。可提至 0.3 让综合论述更流畅。
  temperature_fast: 0.0
    # 快模型生成温度，用于意图分类、历史压缩、查询翻译等辅助任务。
    # 0.0 = 确定性最高，避免这些辅助任务引入随机偏差。
  max_tokens: 4096
    # 每次 LLM 生成的最大 token 数。涵盖了主回答的输出长度上限。
    # 注意：仍受模型上下文窗口和已消耗 token 的双重限制。
    # v8.4 清理: 旧 graph.py 压缩参数（history_compact_threshold 等）已随
    # check_history/compact_history 节点删除，压缩统一走 context_budget 段

graph:
  recursion_limit: 25            # main.py

# v8.4.4: 无消费点的 feature_flags 键已清理（框架与 /api/v1/flags 端点保留，
# 具体开关接入业务时再添加）
feature_flags: {}

# ── Mixed Route ──
# v8.3.1: 已彻底删除服务端路由自动升级（用户手动切换 light/expert，前端 light_mode 决定模式）。
# 保留本段注释作为设计记录，无任何配置项。

api:
  qdrant_timeout: 60             # Qdrant 客户端连接超时秒数

# ── Agent / Sub-agent ──
agent:
  agents_dir: "src/prompts/agents"
  workspace_dir: "workspace"     # 文件读写工作目录
  tool_exec_timeout_sec: 60      # 单个工具执行整体超时（超时返回 [ERR_TIMEOUT]）
  tool_result_caps:              # 子Agent结果回传supervisor的分档截断(字符)
    write-agent: 1000            #   write-agent 只回传保存摘要
    retrieve-agent: 40000        #   v8.3.4: 检索证据清单完整回传（原 15000 截掉关键证据细节）
    analyze-agent: 10000         #   分析结论
    default: 100000              #   read_local_file/pdf_read 保留大值

# ── Write Pipeline (Plan-Execute 长文写作流水线, v8.3.2) ──
pipeline:
  material_min_count: 8         # 材料包就绪最小文献数（不足时 supervisor 补 1 次定向检索）
  max_plan_retries: 1           # Plan 校验失败最大重试次数
  refs_coverage_ratio: 0.4      # 大纲 refs 覆盖章节比例下限
  section_max_tokens: 4000      # 单章生成输出上限
  section_timeout: 120          # 单章 LLM 调用超时(秒)
  resume_enabled: true          # 中断续传（pipeline_tasks 表）开关
  parallel_sections: 3          # v8.4.6: 单章生成并发度（生成并发、按序写盘；1=串行，兼容旧行为）

# ── File I/O ──
file_io:
  read_max_size_mb: 50           # 单次读取文件大小上限（MB）
  write_max_size_mb: 10          # 单次写入文件大小上限（MB）

# ── Statistics ──
statistics:
  alpha: 0.05                    # 统计显著性阈值
  max_sample_size: 100000        # 单次分析最大样本量

# ── Bio Databases ──
bio_db:
  entrez_email: "citrus-agent@localhost"  # NCBI Entrez 必填邮箱
  entrez_tool: "CitrusQAAgent"           # NCBI Entrez 工具名
  kegg_api_url: "https://rest.kegg.jp"           # KEGG API
  uniprot_api_url: "https://rest.uniprot.org"    # UniProt API
  string_api_url: "https://string-db.org/api"    # STRING API

# v8.4.4: HITL 旧体系已删除（stub 端点/配置无消费点）——权限确认由
# permission 体系承担（permission_mode + /api/v2/permission/grant + 前端审批卡片）

# ── Sandbox ──
sandbox:
  enabled: true
  allowed_patterns:
    - read_*
    - search_*
    - list_*
  dangerous_patterns:
    - delete_*
    - exec_*
    - write_*

# ── Context Budget v8.4（存储全量·发送裁剪：SQLite 轨迹 append-only 永不改写，
#    压缩是"发送视图构建"，只在用户轮边界（新请求 load 时）批量执行）──
context_budget:
  enabled: true
  max_tokens: 1000000          # v8.4.3: 发送视图预算=模型窗口(DeepSeek V4 Flash 1M)
                               #   软阈值 75%(750K) 批量压缩 / 硬阈值 93%(930K) 熔断兜底
  soft_threshold: 0.75         # 视图 ≥75% 时批量压缩（一次压到 ~50%，不逐步挤牙膏——
                               #   每次压缩=一次缓存破坏，批量=只破坏一次）
  hard_threshold: 0.93         # 硬阈值：规则式保护截断 + 强制收尾兜底
  target_ratio: 0.50           # 批量压缩目标：压到预算 ~50%
  protect_recent_turns: 3      # 保护名单：最近 3 轮 Q/A 不压缩（当前用户意图/被引用证据/DOI 等标识符
                               #   由压缩提示词保证保留）
  keep_recent_turns: 2         # TRUNCATE 硬截断时保留最近轮数
  summarize_ratio: 0.70
  compact_max_tokens: 800

# ── Context Engineering v8.4 ──
context:
  static_prefix: true           # v8.4.4 转正: SystemMessage 字节级稳定(格式指南/策略卡片/
                                #   skills 移出前缀，追加到当前轮 HumanMessage 尾部)，
                                #   利于 DeepSeek 上下文缓存命中（灰度验证通过后转默认）

# ── Permission v8.4.3（结构化权限确认）──
# 权限拒绝不再靠用户打字"确认权限"（被当普通 query 白烧一轮），
# 由前端审批卡片 + POST /api/v2/permission/grant 闭环。
permission:
  mode: auto_workspace          # ask=危险操作弹卡片审批 | auto_workspace=workspace/output 下写文件免询问 |
                                # deny=一律拒绝危险操作
  wait_sec: 90                  # v8.4.5: ask 模式授权等待秒数（卡片未回应则超时按拒绝处理）

# ── Fast Guard v8.1.1 ──
guard:
  enabled: true
  max_query_length: 12

# ── Supervisor v8.1.1 ──
supervisor:
  max_turns: 8
  max_tools_per_turn: 2         # v8.3.4: 每轮工具调用预算（防一轮内串行多个子代理）
  parallel_tool_calls: false

# ── Subagents v8.1.1 ──
subagents:
  retrieve-agent:
    max_turns: 3
  write-agent:
    max_turns: 6
  analyze-agent:
    max_turns: 2

# ── Light Mode v8.1.1 ──
light:
  max_turns: 2                   # light 模式 supervisor 最大轮次（v8.3.3 接线）

# ── Tool Tags (Agent tool 标签系统) ──
tool_tags:
  rag: [citrus_rag_search]
  analysis_stat: [statistical_analysis, experimental_design]
  file_io: [read_local_file, pdf_read]
  web: [academic_search]
  fulltext: [fetch_fulltext]
  agent: [call_specialist]
  orchestrator_tools: [call_specialist]

# ── Tool Registry (YAML 注册替代代码注册) ──
tools:
  registrations:
    - name: citrus_rag_search
      category: rag
      readonly: true
      concurrency_key: rag
    - name: academic_search
      category: web
      readonly: true
      concurrency_key: web
    - name: fetch_fulltext
      category: rag
      readonly: true
      concurrency_key: rag
    - name: pdf_read
      category: analysis
      readonly: true
      concurrency_key: analysis
    - name: read_local_file
      category: file
      readonly: true
      concurrency_key: file
    - name: write_local_file
      category: write
      readonly: false
      concurrency_key: file
    - name: statistical_analysis
      category: analysis
      readonly: true
      concurrency_key: analysis
    - name: experimental_design
      category: analysis
      readonly: true
      concurrency_key: analysis
